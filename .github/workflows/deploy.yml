# Builds the app and publishes it to GitHub Pages on every push.
#
# ONE-TIME SETUP, done by a human in the browser:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Until that is done, the configure-pages step below fails with:
#   Get Pages site failed. Error: Not Found
#   Create Pages site failed. Error: Resource not accessible by integration
# The `enablement: true` flag asks GitHub to turn Pages on automatically, but
# the workflow token is not always allowed to create the site, so the manual
# step is the dependable path.
#
# Pages on a PRIVATE repo requires a paid GitHub plan. On a free plan the repo
# must be public — which publishes the source, not your library: the library
# lives in your browser and API keys are entered at runtime, never committed.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/content-consumption-tracker-l7limz
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs tsc first, so a type error fails the deploy.
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
